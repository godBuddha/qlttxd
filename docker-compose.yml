# QLTTXD — Docker Compose (demo / staging)
# Cách dùng:
#   cp .env.example .env   # rồi chỉnh password/secret
#   docker compose up --build -d
#   # Lần đầu: http://localhost → đăng ký admin đầu tiên
#   docker compose down -v  # reset toàn bộ (mất dữ liệu)

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: qlttxd
      POSTGRES_USER: qlttxd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlttxd -d qlttxd"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: qlttxd
      PGUSER: qlttxd
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (tối thiểu 32 ký tự)}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile.caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
