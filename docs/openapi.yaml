openapi: 3.0.3
info:
  title: QLTTXD API
  description: >-
    API Hệ thống quản lý trật tự xây dựng — Quản lý hồ sơ vi phạm,
    biên bản, quyết định, khắc phục và báo cáo.
  version: 0.3.2
  contact:
    name: QLTTXD Team
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local dev

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication & authorization
  - name: Hồ sơ
    description: Violation case management
  - name: Báo cáo
    description: Citizen violation reports
  - name: Bản đồ
    description: Map / geospatial data
  - name: Danh mục
    description: Reference catalogues
  - name: Thống kê
    description: Statistics & reporting
  - name: Thông báo
    description: Notifications
  - name: Quản trị
    description: "Admin: users, roles, catalogue & locations"
  - name: Tài liệu
    description: Documentation / docx-pdf exports

paths:
  # ── Health ──────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: connected
                  uptime:
                    type: integer
                  version:
                    type: string
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Auth ────────────────────────────────────────────────
  /api/v1/auth/setup-status:
    get:
      tags: [Auth]
      summary: Check if an admin account exists
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean

  /api/v1/auth/setup-admin:
    post:
      tags: [Auth]
      summary: Create the first admin account
      operationId: setupAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, full_name]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Admin already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username & password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke current access token)
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    patch:
      tags: [Auth]
      summary: Change the current user's password
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent if the account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset with a token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /uploads/{filename}:
    get:
      tags: [Auth]
      summary: Serve an uploaded file
      operationId: getUpload
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Danh mục (public catalogues) ────────────────────────
  /api/v1/danh-muc/loai-vi-pham:
    get:
      tags: [Danh mục]
      summary: List violation types
      operationId: listLoaiViPham
      security: []
      responses:
        '200':
          description: Violation type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoaiViPham'

  /api/v1/danh-muc/hanh-vi:
    get:
      tags: [Danh mục]
      summary: List violation behaviours (optionally by violation type)
      operationId: listHanhVi
      security: []
      parameters:
        - name: loai_vi_pham_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Behaviour list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HanhVi'

  /api/v1/danh-muc/muc-phat:
    get:
      tags: [Danh mục]
      summary: List fine schedules (optionally by behaviour)
      operationId: listMucPhat
      security: []
      parameters:
        - name: hanh_vi_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fine schedule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MucPhat'

  /api/v1/danh-muc/quan-huyen:
    get:
      tags: [Danh mục]
      summary: List districts
      operationId: listQuanHuyen
      security: []
      responses:
        '200':
          description: District list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuanHuyen'

  /api/v1/danh-muc/phuong-xa:
    get:
      tags: [Danh mục]
      summary: List wards (optionally by district)
      operationId: listPhuongXa
      security: []
      parameters:
        - name: quan_huyen_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ward list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhuongXa'

  /api/v1/danh-muc/can-bo:
    get:
      tags: [Danh mục]
      summary: List active case-handler officers
      operationId: listCanBo
      responses:
        '200':
          description: Officer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        full_name:
                          type: string
                        username:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Báo cáo (citizen reports) ───────────────────────────
  /api/v1/bao-cao:
    get:
      tags: [Báo cáo]
      summary: List violation reports
      operationId: listBaoCao
      responses:
        '200':
          description: Report list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BaoCao'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Báo cáo]
      summary: Submit a violation report (multipart with optional images)
      operationId: createBaoCao
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dia_chi, quan_huyen_id, phuong_xa_id]
              properties:
                dia_chi:
                  type: string
                quan_huyen_id:
                  type: string
                  format: uuid
                phuong_xa_id:
                  type: string
                  format: uuid
                mo_ta:
                  type: string
                kinh_do:
                  type: number
                  format: double
                vi_do:
                  type: number
                  format: double
                nguoi_vi_pham_ten:
                  type: string
                anh:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BaoCao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bao-cao/{id}:
    get:
      tags: [Báo cáo]
      summary: Get a violation report by id
      operationId: getBaoCao
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BaoCao'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/bao-cao/{id}/to-ho-so:
    post:
      tags: [Báo cáo]
      summary: Convert a report into a violation case
      operationId: baoCaoToHoSo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Case created from report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HoSo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Hồ sơ (violation cases) ─────────────────────────────
  /api/v1/ho-so:
    get:
      tags: [Hồ sơ]
      summary: List violation cases (paginated)
      operationId: listHoSo
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: trang_thai
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [moi_tiep_nhan, cho_lap_bien_ban, da_lap_bien_ban, cho_ra_quyet_dinh, da_ra_quyet_dinh, dang_khac_phuc, da_khac_phuc, da_dong]
        - name: quan_huyen_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Full-text search (ma_ho_so, mo_ta, dia_chi, loai_vi_pham)
          schema:
            type: string
        - name: tu_ngay
          in: query
          schema:
            type: string
            format: date
        - name: den_ngay
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated case list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHoSo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Hồ sơ]
      summary: Create a new violation case
      operationId: createHoSo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dia_chi, quan_huyen_id, phuong_xa_id, loai_vi_pham_id]
              properties:
                dia_chi:
                  type: string
                quan_huyen_id:
                  type: string
                  format: uuid
                phuong_xa_id:
                  type: string
                  format: uuid
                loai_vi_pham_id:
                  type: string
                  format: uuid
                mo_ta:
                  type: string
                bao_cao_id:
                  type: string
                  format: uuid
                nguoi_vi_pham_id:
                  type: string
                  format: uuid
                hanh_vi_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HoSo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ho-so/{id}:
    get:
      tags: [Hồ sơ]
      summary: Get a violation case by id
      operationId: getHoSo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HoSo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ho-so/{id}/trang-thai:
    patch:
      tags: [Hồ sơ]
      summary: Update a case's status
      operationId: updateHoSoTrangThai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai]
              properties:
                trang_thai:
                  type: string
                  enum: [moi_tiep_nhan, cho_lap_bien_ban, da_lap_bien_ban, cho_ra_quyet_dinh, da_ra_quyet_dinh, dang_khac_phuc, da_khac_phuc, da_dong]
                ghi_chu:
                  type: string
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HoSo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/phan-cong:
    put:
      tags: [Hồ sơ]
      summary: Assign a case to an officer
      operationId: phanCongHoSo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [can_bo_id]
              properties:
                can_bo_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Case assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HoSo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/bien-ban:
    post:
      tags: [Hồ sơ]
      summary: Create an inspection record (biên bản) for a case
      operationId: createBienBan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                noi_dung:
                  type: string
                ngay_lap:
                  type: string
                  format: date
      responses:
        '201':
          description: Inspection record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/quyet-dinh:
    post:
      tags: [Hồ sơ]
      summary: Create a decision (quyết định) for a case
      operationId: createQuyetDinh
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                noi_dung:
                  type: string
                ngay_ban_hanh:
                  type: string
                  format: date
      responses:
        '201':
          description: Decision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/quyet-dinh/ban-hanh:
    post:
      tags: [Hồ sơ]
      summary: Issue / publish a decision
      operationId: banHanhQuyetDinh
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/khac-phuc:
    post:
      tags: [Hồ sơ]
      summary: Record remediation (khắc phục) for a case
      operationId: createKhacPhuc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                noi_dung:
                  type: string
                ngay_khac_phuc:
                  type: string
                  format: date
      responses:
        '201':
          description: Remediation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/khac-phuc/{id}:
    patch:
      tags: [Hồ sơ]
      summary: Update a remediation record
      operationId: updateKhacPhuc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trang_thai:
                  type: string
                noi_dung:
                  type: string
      responses:
        '200':
          description: Remediation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/xuat-bien-ban.docx:
    get:
      tags: [Hồ sơ]
      summary: Export inspection record as .docx
      operationId: xuatBienBanDocx
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: DOCX file download
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/xuat-quyet-dinh.docx:
    get:
      tags: [Hồ sơ]
      summary: Export decision as .docx
      operationId: xuatQuyetDinhDocx
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: DOCX file download
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/ho-so/{id}/xuat-bien-ban.pdf:
    get:
      tags: [Hồ sơ]
