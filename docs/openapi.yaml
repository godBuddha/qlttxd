          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/audit-log:
    get:
      tags: [Quản trị]
      summary: List audit log entries
      operationId: adminAuditLog
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Tài liệu ────────────────────────────────────────────
  /api/v1/docs:
    get:
      tags: [Tài liệu]
      summary: API documentation index
      operationId: getDocs
      security: []
      responses:
        '200':
          description: Documentation index
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        quan_huyen_id:
          type: string
          format: uuid
          nullable: true

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    LoaiViPham:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ten:
          type: string
        so_thu_tu:
          type: integer

    HanhVi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loai_vi_pham_id:
          type: string
          format: uuid
        ten:
          type: string
        khoan:
          type: string

    MucPhat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hanh_vi_id:
          type: string
          format: uuid
        nhom_cong_trinh:
          type: string
        muc_phat:
          type: string
        quy_dinh:
          type: string

    QuanHuyen:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ma:
          type: string
        ten:
          type: string

    PhuongXa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quan_huyen_id:
          type: string
          format: uuid
        ma:
          type: string
        ten:
          type: string

    HoSo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ma_ho_so:
          type: string
          example: HS-2024-00001
        trang_thai:
          type: string
          enum: [moi_tiep_nhan, cho_lap_bien_ban, da_lap_bien_ban, cho_ra_quyet_dinh, da_ra_quyet_dinh, dang_khac_phuc, da_khac_phuc, da_dong]
        dia_chi:
          type: string
        mo_ta:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedHoSo:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HoSo'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    BaoCao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ma_bao_cao:
          type: string
        nguoi_gui_ten:
          type: string
        mo_ta:
          type: string
          nullable: true
        dia_chi:
          type: string
        created_at:
          type: string
          format: date-time
        anh_count:
          type: integer

    ThongBao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tieu_de:
          type: string
        noi_dung:
          type: string
          nullable: true
        da_doc:
          type: boolean
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
